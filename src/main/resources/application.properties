# Job Data Source (Primary)
db.job.repo.jdbc-url=jdbc:postgresql://localhost:5432/spring-batch-metadata
db.job.repo.username=root
db.job.repo.password=toor
db.job.repo.driver-class-name=org.postgresql.Driver

# Source Data Source
db.source.jdbc-url=jdbc:postgresql://localhost:5432/for-devs-university
db.source.username=root
db.source.password=toor
db.source.driver-class-name=org.postgresql.Driver

# Destination Data Source
db.destination.jdbc-url=jdbc:mysql://localhost:3306/university
db.destination.username=root
db.destination.password=toor
db.destination.driver-class-name=com.mysql.cj.jdbc.Driver


logging.level.org.springframework.jdbc.datasource = DEBUG
logging.level.org.springframework.boot.autoconfigure.jdbc = DEBUG

spring.batch.jdbc.initialize-schema=always
batch.db.initialize-schema=ALWAYS
server.port=8081
